<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Engagement - Alvin & Ima</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
    <style>
        html { scroll-behavior: smooth; }
        body {
            margin: 0; padding: 0; font-family: 'Quicksand', sans-serif;
            background: linear-gradient(to bottom, #e0f2fe 0%, #bae6fd 100%);
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; color: #1e3a8a; overflow-x: hidden;
        }
        .container {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; width: 100%;
        }
        .card {
            background: white; padding: 30px; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center; max-width: 80%; width: 400px;
            border: 2px solid #0284c7;
        }
        h1 { font-family: 'Dancing Script', cursive; color: #0284c7; font-size: 2.5em; margin: 10px 0; }
        .tamu { font-weight: bold; font-size: 1.2em; color: #334155; margin: 15px 0; display: block; }
        .btn {
            display: inline-block; margin-top: 20px; padding: 12px 25px;
            background: #0284c7; color: white; text-decoration: none;
            border-radius: 50px; font-weight: bold; box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3);
            cursor: pointer; border: none;
        }
        #detail {
            margin: 50px 0; padding: 30px; background: white; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center;
            max-width: 80%; width: 400px; border: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>

    <audio id="lagu" preload="auto" loop>
    <source src="https://files.catbox.moe/p9o13y.mp3" type="audio/mpeg">
</audio>


    <div class="container">
        <div class="card">
            <p style="letter-spacing: 2px; text-transform: uppercase; font-size: 0.8em;">The Engagement of</p>
            <h1>Alvin & Ima</h1>
            <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 20px 0;">
            <p>Kepada Yth:</p>
            <span class="tamu" id="nama-tamu">Nama Tamu</span>
            <p>Kami mengundang Anda untuk hadir di acara tunangan kami.</p>
            <button onclick="mulai()" class="btn">Buka Undangan</button>

        </div>
    </div>

    <div id="detail">
        <h2 style="color: #0284c7; font-family: 'Dancing Script', cursive; font-size: 2em;">Detail Acara</h2>
        <p><strong>Hari/Tanggal:</strong> Minggu, 26 April 2026</p>
        <p><strong>Waktu:</strong> 09:00 WIB - Selesai</p>
        <p><strong>Tempat:</strong> Kediaman Mempelai Wanita (Ima)</p>
        <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 20px 0;">
        <p>Doa restu Anda adalah kado terindah bagi kami.</p>
        <a href="Https://maps.app.goo.gl/8BVcYMNaKN5d7VqJ9?g_st=ac" target="_blank" style="color: #0284c7; text-decoration: none; font-weight: bold;">📍 Buka Google Maps</a>
    </div>

<script>
    // Ambil nama dari link
    const urlParams = new URLSearchParams(window.location.search);
    const nama = urlParams.get('to');
    if (nama) {
        document.getElementById('nama-tamu').innerText = nama.replace(/\+/g, ' ');
    }

    // Fungsi sakti buat nyalain lagu
    function mulai() {
        var audio = document.getElementById('lagu');
        
        // Coba putar audio
        audio.play().then(() => {
            console.log("Lagu diputar");
        }).catch((error) => {
            console.log("Gagal putar otomatis, tapi tetep scroll");
        });

        // Scroll ke detail
        document.getElementById('detail').scrollIntoView({ behavior: 'smooth' });
    }
</script>

</body>
</html>
